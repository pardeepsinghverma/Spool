apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.afinitycode.spool.ytdlp'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(':expo-modules-core').projectDir.absolutePath,
  'ExpoModulesCorePlugin.gradle',
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

/**
 * Pre-release limits, stamped into the binary at build time.
 *
 * The expiry is computed here rather than stored on the device on purpose:
 * there is nothing for a tester to clear, reset or reinstall past. It also
 * means every APK cut from this tree carries its own deadline, so "extend the
 * trial" is a rebuild rather than a server call.
 *
 * Override any of them from the command line, e.g.
 *   ./gradlew :app:assembleRelease -PSPOOL_TRIAL=false
 */
def trialOn = (project.findProperty('SPOOL_TRIAL') ?: 'true').toBoolean()
def trialDays = (project.findProperty('SPOOL_TRIAL_DAYS') ?: '7') as long
def trialMaxSaves = (project.findProperty('SPOOL_TRIAL_SAVES') ?: '20') as int
def trialMaxSeconds = (project.findProperty('SPOOL_TRIAL_SECONDS') ?: '180') as int
def builtAt = System.currentTimeMillis()

/**
 * SHA-256 of the certificate release builds are signed with, so a repackaged
 * build can tell that it is one. Not a secret — it is readable from any signed
 * APK — so it lives in the tree rather than in a private properties file.
 *
 * Only applied to the release variant. Debug builds are signed with the debug
 * keystore, and pinning there would make every local build refuse to run.
 */
def signingSha = project.findProperty('SPOOL_SIGNING_SHA256')
  ?: '6A836D549AF7FEC349484FB625D11E77C678D6C2433736B16E0346BEB722F278'

/**
 * The public half of the licence signing key, and where to ask for a licence.
 *
 * Neither is a secret. The key is public by construction and the URL is in
 * every packet the app sends; both live in the tree because a public key kept
 * in a private file is a public key that eventually gets lost, and losing it
 * invalidates every licence ever issued.
 *
 * Generate the pair once with `php tools/keygen.php` on the licence server —
 * server/README.md says where that server lives. It prints the private half to
 * paste into that server's config.php, and the public half to pass here.
 *
 * The production server is https://spool.pardeep.app (admin panel at /admin).
 * It must be https: a release build denies
 * cleartext, and `syncLicence` reads a refused request as "no news", so an
 * http:// URL here produces a server that never sees a request and an app that
 * reports nothing wrong.
 *
 *   ./gradlew :app:assembleRelease \
 *     -PSPOOL_LICENCE_KEY=<public key> \
 *     -PSPOOL_LICENCE_SERVER=https://spool.pardeep.app
 */
def licenceKey = project.findProperty('SPOOL_LICENCE_KEY') ?: ''
def licenceServer = project.findProperty('SPOOL_LICENCE_SERVER') ?: ''

android {
  namespace 'com.afinitycode.spool.ytdlp'
  compileSdk 36

  buildFeatures {
    buildConfig true
  }

  defaultConfig {
    minSdk 24
    targetSdk 36

    buildConfigField 'boolean', 'TRIAL', "${trialOn}"
    buildConfigField 'long', 'BUILT_AT', "${builtAt}L"
    buildConfigField 'long', 'TRIAL_DAYS', "${trialDays}L"
    buildConfigField 'long', 'TRIAL_EXPIRES_AT', "${builtAt + trialDays * 24 * 60 * 60 * 1000}L"
    buildConfigField 'int', 'TRIAL_MAX_DOWNLOADS', "${trialMaxSaves}"
    buildConfigField 'int', 'TRIAL_MAX_SECONDS', "${trialMaxSeconds}"
    // Overridden for release below; empty here so debug builds do not pin.
    buildConfigField 'String', 'SIGNING_SHA256', '""'

    // An empty key fails closed: LicenseGuard cannot construct a verifier, every
    // token fails to verify, and nobody is entitled. That is the right way round
    // for a debug build, and the release variant below refuses to be built that
    // way at all rather than shipping a paywall nobody can get past.
    buildConfigField 'String', 'LICENCE_KEY', "\"${licenceKey}\""
    buildConfigField 'String', 'LICENCE_SERVER', "\"${licenceServer}\""
    // Declares the ABIs this module supports. Note this does NOT keep the
    // youtubedl-android AAR's per-ABI Python and ffmpeg payloads out of the
    // final APK — abiFilters constrains this module's own native compilation,
    // not transitive jniLibs. Size is controlled by the app-level ABI splits in
    // plugins/withAbiSplits.js.
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
    }
  }

  buildTypes {
    release {
      buildConfigField 'String', 'SIGNING_SHA256', "\"${signingSha}\""
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  packagingOptions {
    // The bundled Python payload is a zip that must stay uncompressed so it can
    // be extracted at runtime.
    jniLibs {
      useLegacyPackaging true
    }
    resources {
      excludes += ['META-INF/*', '**/libjsc*.so']
    }
  }
}


/**
 * A release build with no licence key would install, run, take payments and then
 * refuse every licence it was handed — a failure invisible until a real person
 * has paid real money, which is the worst possible moment to discover it. Fail
 * at configuration time instead.
 *
 * At the top level rather than inside `android { }` on purpose: the closure needs
 * `gradle` off the Project, and resolving it through the android extension's
 * delegate works only by Groovy's owner fallback. This is not a place to rely on
 * that.
 *
 * Deliberately not applied to debug. Local builds have no server and no key, and
 * refusing there would break every `expo run:android`; they fail closed instead —
 * no verifier, nobody entitled, the trial applies.
 */
gradle.taskGraph.whenReady { graph ->
  def releasing = graph.allTasks.any { it.name.toLowerCase().contains('release') }
  if (releasing && (licenceKey.isEmpty() || licenceServer.isEmpty())) {
    throw new GradleException(
      'Release builds need a licence key and server. Run `php tools/keygen.php`, ' +
        'paste the public key into SPOOL_LICENCE_KEY, ' +
        'and pass -PSPOOL_LICENCE_SERVER=https://spool.pardeep.app. See server/README.md.',
    )
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.findProperty('kotlinVersion') ?: '2.0.21'}"

  // yt-dlp + Python 3.8, the same foundation Seal and YTDLnis ship on.
  implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
  implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'androidx.core:core-ktx:1.13.1'

  // MediaSessionCompat and the MediaStyle notification behind background
  // playback. The platform classes exist from API 21, but the compat pair is
  // what makes one notification builder work down to this module's minSdk.
  implementation 'androidx.media:media:1.7.0'

  // Dominant-colour extraction for cover art. The design's whole premise is
  // that surfaces derive from the artwork, and pixels are not reachable from
  // JavaScript — this is the platform's own answer to exactly that problem.
  implementation 'androidx.palette:palette-ktx:1.0.0'

  // On-device OCR of payment screenshots (`recognizeText`). The *bundled*
  // artifact, not `play-services-mlkit-text-recognition`: that one downloads
  // its model through Play services on first use, and a sideloaded app cannot
  // assume Play services is there, current, or willing — the moment a user has
  // just paid is the worst time to find out. Costs a few MB per ABI. 16.0.1 is
  // the latest on Google's Maven as of this change.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
