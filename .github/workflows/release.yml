name: Release APK

# Tag a version to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64 of the release .jks
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The `secrets` context is not available in a job-level `if`, so the check for
  # "are we able to sign at all" has to happen in a job of its own. A tag pushed
  # before the secrets exist then skips cleanly instead of failing red.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      signable: ${{ steps.check.outputs.signable }}
    steps:
      - id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signable=true" >> "$GITHUB_OUTPUT"
          else
            echo "signable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured — skipping the release build. See README → Cutting a release."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.signable == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # android/ is generated, not committed — the signing config comes back
      # via the withReleaseSigning config plugin.
      - name: Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_SPOOL_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SPOOL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SPOOL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_SPOOL_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon

      # A debug-signed APK here would mean the secrets silently failed to apply,
      # and shipping one would strand every user on the wrong key.
      - name: Verify signing and collect APKs
        run: |
          mkdir -p dist
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          FOUND=0

          for apk in android/app/build/outputs/apk/release/*.apk; do
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" > certs.txt
            cat certs.txt
            if grep -qi 'CN=Android Debug' certs.txt; then
              echo "::error::$apk is debug-signed — signing secrets did not apply."
              exit 1
            fi
            # app-arm64-v8a-release.apk -> spool-<version>-arm64-v8a.apk
            ABI=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/spool-${VERSION}-${ABI}.apk"
            FOUND=$((FOUND + 1))
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No APKs were produced."
            exit 1
          fi

          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: spool-apks
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Sideload build. Android 7.0 (API 24) or newer.

            **Which file?** Take `arm64-v8a` unless you know otherwise — it covers
            essentially every phone made since 2016. `armeabi-v7a` is for older
            32-bit devices, `x86_64` for emulators.

            Verify before installing:

            ```
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            Spool is not on the Play Store and cannot be — see the README for why.
            Downloading from YouTube violates YouTube's Terms of Service; this
            build is intended for your own uploads, Creative Commons and
            public-domain material, and personal offline use where your local
            law allows it.
